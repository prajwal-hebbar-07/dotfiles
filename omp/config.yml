symbolPreset: nerd
composer:
  shape: band
theme:
  dark: dark-solarized
setupVersion: 2
modelRoles:
  default: anthropic/claude-opus-5-5:high
  plan: anthropic/claude-opus-5-5:high
  slow: openai-codex/gpt-6.1-sol:high
  task: anthropic/claude-sonnet-5-5:medium
  smol: anthropic/claude-haiku-5-5:low
  commit: anthropic/claude-haiku-5-5:low
  tiny: anthropic/claude-haiku-5-5:low
  memory: anthropic/claude-haiku-5-5:medium
  vision: openai-codex/gpt-6.1-sol:medium
  advisor: anthropic/claude-opus-5-5:medium
  judge: anthropic/claude-sonnet-5-5:medium
  image: openai-codex/gpt-image-2
  web: web/exa
  speech: local/kokoro
  dictation: local/whisper-large-v3-turbo
  review: openai-codex/gpt-6.1-sol:high
  scout: anthropic/claude-haiku-5-5:medium
dev:
  autoqaConsent: granted
task:
  agentModelOverrides:
    task: "@task"
    sonic: "@smol"
    scout: "@scout"
    reviewer: "@review, anthropic/claude-opus-5-5:high"
    security-reviewer: "@review"
  maxRuntimeMs: 3600000
  isolation:
    enabled: true
    merge: branch
    commits: ai
github:
  enabled: true
secrets:
  enabled: true
security:
  enabled: true
compaction:
  handoffSaveToDisk: true
retry:
  usageAwareFallback: true
  usageReservePct: 10
  usageReservePolicy: fail-closed
  waitForUsageReset: false
claudeResets:
  autoRedeem: "yes"