[editor]
line-number = "absolute"
mouse = true
true-color = true
cursorline = true
bufferline = "multiple"
# A prefix that waits for another key lists the keys that follow.
auto-info = true

[editor.cursor-shape]
normal = "block"
insert = "bar"
select = "underline"

[editor.statusline]
# Paint the status line in the mode's colour.
color-modes = true

[editor.file-picker]
# false means hidden files are listed.
hidden = false

# Leader, matching the Neovim one. Space f, Space b, Space ?, and Ctrl-w
# window mode stay Helix's own.
[keys.normal]
K = "hover"

[keys.normal.space]
w = ":write"
q = ":quit"
x = ":write-quit-all"
g = "global_search"
G = "changed_file_picker"
F = ":format"

[keys.normal."]"]
c = "goto_next_change"

[keys.normal."["]
c = "goto_prev_change"
