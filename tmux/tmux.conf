# ─────────────────────────────────────────────────────────────────────────────
# tmux — Pale Knight
#
# A Hollow Knight-flavoured configuration over Material Palenight: indigo-violet
# chrome, Palenight's own foreground, soul-cyan for what is alive and focused,
# infection-amber for what demands attention. The bar warms to amber on prefix.
#
# Source of truth: dotfiles/tmux/tmux.conf  (~/.config/tmux/tmux.conf -> here)
# Reload in place: prefix C-r
# ─────────────────────────────────────────────────────────────────────────────


# ── Palette ──────────────────────────────────────────────────────────────────
# Shared with ghostty/themes/pale-knight and zsh/zshrc. Surfaces sit in
# Palenight's own OKLCH hue band (278-286) at its chroma, not half of it, so the
# ground reads violet rather than blue-grey. Accents are generated at one fixed
# lightness (L = 0.72) on Palenight's hues, so hue is the only difference
# between them — six distinguishable colours of equal weight, none eye-catching.
#
# void      #26283b   the abyss, deepest background
# crypt     #32334a   status bar ground
# shade     #444364   raised cell / inactive border
# stone     #696e93   dim text, separators
# ash       #9297ba   inactive window names
# bone      #a6accd   body text
# pale      #d4d7f1   pale king white, active text
# soul      #5cb1d2   cyan, focus and life
# lifeblood #86a4e1   blue, secondary accent
# infection #c39e5c   amber, prefix held / bells / prompts
# essence   #ba92d5   violet, quiet metadata

%hidden VOID="#26283b"
%hidden CRYPT="#32334a"
%hidden SHADE="#444364"
%hidden STONE="#696e93"
%hidden ASH="#9297ba"
%hidden BONE="#a6accd"
%hidden PALE="#d4d7f1"
%hidden SOUL="#5cb1d2"
%hidden LIFEBLOOD="#86a4e1"
%hidden INFECTION="#c39e5c"
%hidden ESSENCE="#ba92d5"


# ── Prefix: C-s ──────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-s
bind C-s send-prefix           # prefix C-s sends a literal C-s to the pane


# ── Numbering: windows and panes start at 1 ──────────────────────────────────
# So the first window answers to `prefix 1`, and closing a window in the middle
# closes the gap instead of leaving a hole.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on


# ── Windows and panes ────────────────────────────────────────────────────────
# Rename starts from an empty prompt — no prefilled name to delete first.
bind r command-prompt -p "rename window:" { rename-window "%%" }
bind S command-prompt -p "rename session:" { rename-session "%%" }

bind x kill-pane                                       # close this pane
bind X kill-window                                     # close this window

# Splits inherit the current pane's directory; new windows start at $HOME.
unbind %
unbind '"'
bind '\' split-window -h -c "#{pane_current_path}"     # left | right
bind '|' split-window -h -c "#{pane_current_path}"     # same, unshifted
bind '-' split-window -v -c "#{pane_current_path}"     # top / bottom
bind c   new-window     -c "$HOME"

# lazygit, straight into a popup over the current pane's repository.
bind g display-popup -E -d "#{pane_current_path}" -w 90% -h 90% \
  -T " \u25c8 lazygit " "lazygit"

bind C-r source-file "$HOME/.config/tmux/tmux.conf" \; \
  display-message "Pale Knight reforged"


# ── Behaviour ────────────────────────────────────────────────────────────────
set -g mouse on                 # click panes/windows, drag borders, wheel scroll
set -g escape-time 10           # don't mistake Esc for a meta sequence
set -g focus-events on          # let editors see focus gain/loss
set -g history-limit 50000
set -g set-clipboard on
setw -g mode-keys vi

# True colour, so the palette above is not quantised to 256.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",alacritty:RGB"


# ── Chrome ───────────────────────────────────────────────────────────────────
set -g pane-border-lines heavy
set -g pane-border-style "fg=$SHADE"
set -g pane-active-border-style "fg=$SOUL"
set -g display-panes-colour "$STONE"
set -g display-panes-active-colour "$SOUL"

# `fill=` is required: since tmux 3.6 the prompt/message is drawn into an area
# over a copy of the old status line, and only a fill colour erases what it
# does not cover. Without it, window names bleed through behind the prompt.
# Insert mode reads as amber text on the status ground; vi command mode raises
# the whole line to shade so the mode change is visible without shouting.
set -g message-style "bg=$CRYPT,fg=$INFECTION,bold,fill=$CRYPT"
set -g message-command-style "bg=$SHADE,fg=$PALE,fill=$SHADE"
# Copy-mode selection: dark text on the muted blue reads at 6.5:1. Pale on
# lifeblood would be 1.7:1 — invisible.
set -g mode-style "bg=$LIFEBLOOD,fg=$VOID"
setw -g clock-mode-colour "$SOUL"

set -g popup-style "bg=$VOID,fg=$BONE"
set -g popup-border-style "fg=$SOUL"
set -g popup-border-lines rounded


# ── Status bar ───────────────────────────────────────────────────────────────
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-interval 5
set -g status-style "bg=$CRYPT,fg=$BONE"
set -g status-left-length 48
set -g status-right-length 72

# Session badge. Soul-cyan at rest; warms to infection-amber while prefix is held.
# Glyphs are restricted to what JetBrains Mono itself covers (U+25C8, U+25C6,
# U+258F) — anything else falls back to Menlo or STIX and breaks the cell rhythm.
set -g status-left \
"#{?client_prefix,#[bg=$INFECTION],#[bg=$SOUL]}#[fg=$VOID,bold] \u25c8 #S #[none]\
#{?client_prefix,#[fg=$INFECTION],#[fg=$SOUL]}#[bg=$CRYPT]\u258f "

set -g status-right \
"#[fg=$ESSENCE]#{b:pane_current_path} \
#[fg=$STONE]\u258f #[fg=$LIFEBLOOD]%H:%M \
#[fg=$STONE]\u258f #[fg=$BONE]#h "

setw -g window-status-separator ""
setw -g window-status-format \
"#[fg=$STONE,bg=$CRYPT] #I #[fg=$ASH]#W#[fg=$INFECTION]#{?window_flags,#F,} "
setw -g window-status-current-format \
"#[fg=$PALE,bg=$SHADE,bold] #I #[fg=$SOUL,nobold]\u25c6 #[fg=$PALE,bold]#W\
#[fg=$SOUL,nobold]#{?window_zoomed_flag, \u22a1,} "

setw -g window-status-bell-style "fg=$INFECTION,bold"
setw -g window-status-activity-style "fg=$ESSENCE,none"
